<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850">
<defs><style>.title{font:bold 26px sans-serif;fill:#111}.head{font:bold 17px sans-serif;fill:#111}.body{font:14px sans-serif;fill:#222}.box{fill:white;stroke:#34445c;stroke-width:2}.hdr{fill:#eaf0f8;stroke:#34445c;stroke-width:2}.ln{stroke:#333;stroke-width:2;fill:none}</style></defs>
<rect width="1280" height="850" fill="#fafafa"/><text x="640" y="36" text-anchor="middle" class="title">Vending Machine — UML Class Diagram</text>
<g><rect x="35" y="75" width="270" height="150" class="box"/><rect x="35" y="75" width="270" height="35" class="hdr"/><text x="170" y="98" text-anchor="middle" class="head">Product</text><text x="50" y="135" class="body">- productId: String</text><text x="50" y="157" class="body">- productName: String</text><text x="50" y="179" class="body">- productPrice: double</text><text x="50" y="205" class="body">+ getters</text></g>
<g><rect x="365" y="75" width="285" height="170" class="box"/><rect x="365" y="75" width="285" height="35" class="hdr"/><text x="507" y="98" text-anchor="middle" class="head">InventoryItem</text><text x="380" y="135" class="body">- product: Product</text><text x="380" y="157" class="body">- quantity: int</text><text x="380" y="195" class="body">+ addQuantity(int)</text><text x="380" y="217" class="body">+ reduceQuantity(int)</text></g>
<g><rect x="710" y="75" width="320" height="195" class="box"/><rect x="710" y="75" width="320" height="35" class="hdr"/><text x="870" y="98" text-anchor="middle" class="head">Inventory</text><text x="725" y="135" class="body">- inventory: Map</text><text x="725" y="163" class="body">+ addProduct(item)</text><text x="725" y="185" class="body">+ isProductAvailable(id)</text><text x="725" y="207" class="body">+ getProduct(id)</text><text x="725" y="229" class="body">+ reduceStock / refillStock</text></g>
<g><rect x="35" y="330" width="285" height="195" class="box"/><rect x="35" y="330" width="285" height="35" class="hdr"/><text x="177" y="353" text-anchor="middle" class="head">Payment</text><text x="50" y="390" class="body">- totalAmountPaid: double</text><text x="50" y="420" class="body">+ addMoney(amount)</text><text x="50" y="442" class="body">+ isSufficient(price)</text><text x="50" y="464" class="body">+ calculateBalance(price)</text><text x="50" y="486" class="body">+ refundMoney() / reset()</text></g>
<g><rect x="365" y="330" width="340" height="225" class="box"/><rect x="365" y="330" width="340" height="35" class="hdr"/><text x="535" y="353" text-anchor="middle" class="head">VendingMachine (Context)</text><text x="380" y="390" class="body">- inventory: Inventory</text><text x="380" y="412" class="body">- product: Product</text><text x="380" y="434" class="body">- payment: Payment</text><text x="380" y="456" class="body">- state: VendingMachineState</text><text x="380" y="490" class="body">+ selectProduct / insertMoney</text><text x="380" y="512" class="body">+ dispenseProduct / cancelTransaction</text></g>
