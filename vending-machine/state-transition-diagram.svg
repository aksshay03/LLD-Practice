<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<defs><style>.title{font:bold 28px sans-serif;fill:#111}.label{font:18px sans-serif;fill:#222}.note{font:15px sans-serif;fill:#333}.state{fill:#f2f6ff;stroke:#34445c;stroke-width:2.5}.arrow{stroke:#333;stroke-width:2.5;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs>
<rect width="1200" height="650" fill="#fafafa"/><text x="600" y="45" text-anchor="middle" class="title">Vending Machine — State Transitions</text>
<circle cx="80" cy="290" r="10" fill="#333"/><rect x="145" y="245" rx="12" width="220" height="90" class="state"/><text x="255" y="280" text-anchor="middle" class="label">Idle</text><text x="255" y="307" text-anchor="middle" class="note">Select available product</text>
<rect x="465" y="245" rx="12" width="245" height="90" class="state"/><text x="587" y="280" text-anchor="middle" class="label">Payment Pending</text><text x="587" y="307" text-anchor="middle" class="note">Accept payment / cancel</text>
<rect x="820" y="245" rx="12" width="245" height="90" class="state"/><text x="942" y="280" text-anchor="middle" class="label">Dispensing</text><text x="942" y="307" text-anchor="middle" class="note">Dispense and calculate change</text>
<path d="M90 290 H145 M365 290 H465 M710 290 H820" class="arrow"/><text x="415" y="270" text-anchor="middle" class="note">Product selected</text><text x="765" y="270" text-anchor="middle" class="note">Payment sufficient</text>
<path d="M942 335 V430 H255 V335" class="arrow"/><text x="600" y="417" text-anchor="middle" class="note">Dispense, return change, reset</text>
<path d="M587 335 V505 H255 V335" class="arrow"/><text x="420" y="492" text-anchor="middle" class="note">Cancel and refund</text>
<path d="M587 245 V150 H587 V245" class="arrow"/><text x="750" y="142" text-anchor="middle" class="note">Insufficient payment: remain in Payment Pending</text>
<text x="600" y="590" text-anchor="middle" class="note">Cancellation is supported while payment is pending; cancellation during dispensing is rejected.</text>
</svg>